name: ai-trading-copilot

on:
  push:
    paths: ["ai-trading-copilot/**", ".github/workflows/ai-trading-copilot.yml"]
  pull_request:
    paths: ["ai-trading-copilot/**", ".github/workflows/ai-trading-copilot.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-trading-copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-trading-copilot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
